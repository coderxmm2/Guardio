
name: Build Guardio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Guardio project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          GRADLE_FILE=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle wrapper found inside ZIP."
            find extracted -maxdepth 3 -type f | head -50
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Guardio APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Guardio APK
        uses: actions/upload-artifact@v4
        with:
          name: Guardio-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
          
