
name: Build Guardio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          GRADLE_FILE=$(find . -type f -name gradlew -not -path '*/.git/*' -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found. Upload the ZIP contents."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Gradle permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Guardio APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Guardio APK
        uses: actions/upload-artifact@v4
        with:
          name: Guardio-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
          
